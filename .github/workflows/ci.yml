name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buf_breaking:
        description: Run the optional buf breaking check
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# While the repository is private, jobs use the self-hosted runner of ci/README.md. Once it is
# public, the same workflow selects GitHub-hosted runners: Ubuntu for lint/docs/generation
# and the full Linux/macOS/Windows test matrix. A self-hosted runner must never serve a public
# repository; the release checklist retires it explicitly.

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      # 1.88 is the floor set by wit-parser.
      - run: cargo test --workspace --locked

  generated:
    name: generated output and release freeze
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - name: Determine freeze base
        id: base
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="${PUSH_BEFORE}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "cannot resolve freeze base ${base}" >&2
            exit 1
          fi
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      - run: ci/check-generated.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      - run: ci/check-release-freeze.sh crates/witforge/tests/fixtures/versions/wit "${FREEZE_BASE}"
        env:
          FREEZE_BASE: ${{ steps.base.outputs.sha }}

  buf:
    name: optional buf breaking
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buf_breaking }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - name: Install buf
        shell: bash
        env:
          BUF_VERSION: 1.74.0
          BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
      # Compares the fixture's generated schema with the one at HEAD^.
      - run: ci/check-buf.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
          BUF: ${{ runner.temp }}/buf
          BUF_REQUIRED: "1"
