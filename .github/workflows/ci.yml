name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buf_breaking:
        description: Run the optional buf breaking check
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# While the repository is private, jobs use the self-hosted runner of ci/README.md. Once it is
# public, the same workflow selects GitHub-hosted runners: Ubuntu for lint/docs/plan/generation
# and the full Linux/macOS/Windows test matrix. A self-hosted runner must never serve a public
# repository; the release checklist retires it explicitly.

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      # 1.88 is the floor set by wit-parser.
      - run: cargo test --workspace --locked

  plan:
    name: aplan plan and evidence
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: ci/install-aplan.sh "$RUNNER_TEMP/aplan"
      - run: '"$RUNNER_TEMP/aplan" check'
      - run: '"$RUNNER_TEMP/aplan" verify'
      - run: '"$RUNNER_TEMP/aplan" export-agents-md --check AGENTS.md'
      - run: '"$RUNNER_TEMP/aplan" check-docs'

  generated:
    name: generated output and release freeze
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - name: Determine freeze base
        id: base
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "cannot resolve freeze base ${base}" >&2
            exit 1
          fi
          echo "sha=${base}" >> "$GITHUB_OUTPUT"
      - run: ci/check-generated.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      - run: ci/check-release-freeze.sh crates/witforge/tests/fixtures/versions/wit "${{ steps.base.outputs.sha }}"

  buf:
    name: optional buf breaking
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buf_breaking }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - run: ci/check-buf.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
