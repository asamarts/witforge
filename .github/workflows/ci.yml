name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC: exercises security advisories, bounded fuzz smoke, and floating
    # current stable without blocking pushes to main. GitHub disables scheduled workflows after
    # 60 days without repository activity; failures notify maintainers via GitHub Actions alerts.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      buf_breaking:
        description: Run the optional buf breaking check
        type: boolean
        default: false
      scheduled_checks:
        description: Also run the weekly floating-stable and fuzz-smoke checks
        type: boolean
        default: false

permissions: {}

# Pull requests cancel superseded runs on the same PR ref. Every push to main gets its own
# per-commit group so GitHub's single-pending-run concurrency limit can never cancel a commit on
# main before it produces a `ci ok` result.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'schedule' && 'schedule' || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned lint/gate toolchain so new rustfmt/Clippy lints arrive through a reviewed change rather
  # than breaking main mid-week; contributors are not pinned by a repo-wide rust-toolchain.toml,
  # MSRV stays on 1.88, and the weekly `floating-stable` job tracks current stable.
  CI_RUST_TOOLCHAIN: "1.100.0"

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Reject whitespace errors in tracked files
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fuzz workspace is separate from the main workspace, so these stable checks must
      # name it explicitly; the fuzz campaign itself still runs under cargo-fuzz/nightly.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  workflows:
    name: workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned rather than the runner image's shellcheck, whose version (and so its findings and
      # codes) changes with the image.
      - name: Install actionlint and shellcheck
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.8
          ACTIONLINT_SHA256: be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" actionlint
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSfL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      # actionlint runs shellcheck on every `run:` script; the masked-return check catches a
      # command substitution whose failure would not fail its step.
      - run: shellcheck --version && actionlint -color
        env:
          SHELLCHECK_OPTS: --enable=check-extra-masked-returns
      - run: shellcheck ci/*.sh
      - run: bash ci/test-release-asset.sh
      - run: bash ci/test-release-version.sh
      - run: bash ci/test-semver-release-type.sh
      - run: node --test action/test.js
      # Execute the checked-out action through GitHub's JavaScript-action runtime. Unit tests
      # call index.js directly and therefore cannot catch a retired `runs.using` value or an
      # input the runner exports under another name than the action reads. The fixture pair has
      # breaking changes: the first step reports them (`diff-check: false`), the second must
      # fail on them, so together they prove `diff-old`, `diff-new`, and `diff-check` arrive.
      # The second step's outcome cannot tell a failed gate from a failed install. The first
      # step has just installed the same release on this runner, so an input regression, which
      # fails every run, is not hidden by a transient download failure in one of them. `W10-086`
      # replaces this with an assertion on the command that failed.
      - name: Smoke the local Action
        uses: ./
        with:
          version: 0.6.0
          check: crates/witforge/tests/fixtures/versions/wit/v0.2
          diff-old: crates/witforge/tests/fixtures/versions/wit/v0.1
          diff-new: crates/witforge/tests/fixtures/versions/wit/v0.2
          diff-check: "false"
          github-token: ${{ github.token }}
      - name: Run the local Action's diff gate on a breaking change (expected to fail)
        id: diff-gate
        continue-on-error: true
        uses: ./
        with:
          version: 0.6.0
          diff-old: crates/witforge/tests/fixtures/versions/wit/v0.1
          diff-new: crates/witforge/tests/fixtures/versions/wit/v0.2
          github-token: ${{ github.token }}
      - name: Require the diff gate to have failed in witforge diff
        env:
          OUTCOME: ${{ steps.diff-gate.outcome }}
          FAILED_COMMAND: ${{ steps.diff-gate.outputs.failed-command }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the Action's diff gate passed a breaking change (outcome: $OUTCOME)"
            exit 1
          fi
          if [ "$FAILED_COMMAND" != "witforge diff" ]; then
            echo "::error::expected diff gate to fail in 'witforge diff', got '${FAILED_COMMAND}'"
            exit 1
          fi

  published-action:
    name: published Action (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` (`aarch64-unknown-linux-gnu`) joins this matrix when the pin moves to
        # 0.7.0, the first release publishing Linux arm64 archives.
        runner: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A remote pinned ref proves tag resolution and each published platform archive. The local
      # Action smoke above remains the pre-publication proof for changes to action.yml/action/.
      - name: Smoke the published 0.6.0 Action
        uses: asamarts/witforge@v0.6.0
        with:
          version: 0.6.0
          check: crates/witforge/tests/fixtures/versions/wit/v0.2
          generators: ""
          github-token: ${{ github.token }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo test --workspace --locked
      # /bin/bash is 3.2 on macOS, which consumers of the freeze script may run it with.
      - if: runner.os != 'Windows'
        run: /bin/bash ci/test-release-freeze.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      # 1.88 is the floor set by wit-parser.
      - run: cargo test --workspace --locked

  package:
    name: package (publish dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
      # Packages and verifies both crates, the CLI against the library through a temporary
      # registry, so a packaging mistake shows up before a release tag.
      - run: cargo publish --workspace --dry-run --locked
      # A second dry run after a library change verifies the CLI against the change, not against
      # the library cargo unpacked and built for the first run.
      - run: ci/test-publish.sh

  semver:
    name: public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo install --locked cargo-semver-checks --version 0.51.0
      # W10-095 is the sole planned pre-1.0 API break. The selector permits it through the
      # 0.7.0 tag commit, then returns to `minor` once that tag is on an ancestor of HEAD.
      # No baseline is named, so cargo-semver-checks compares with the newest release on
      # crates.io that is not newer than the workspace version.
      - run: |
          release_type="$(bash ci/semver-release-type.sh .)"
          cargo semver-checks check-release -p witforge --release-type "$release_type"

  public-api:
    name: documented public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-11
      - run: ci/check-public-api.sh

  benchmark:
    name: benchmark budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test -p witforge --test bench --release --locked -- --nocapture

  security:
    name: advisories and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.9
      - run: ci/check-security.sh

  plan:
    name: aplan plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Pin the published release; no aplan binary is committed to this repository.
      - name: Install aplan 0.6.0
        run: cargo install --locked aplan --version 0.6.0 --root "$RUNNER_TEMP/aplan"
      - name: Run the four plan gates
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/aplan/bin:$PATH"
          aplan check
          aplan verify
          aplan export-agents-md --check AGENTS.md
          aplan check-docs

  generated:
    name: generated output and release freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo build --locked -p witforge-cli
      - run: ci/check-generated.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      - run: ci/check-release-freeze.sh crates/witforge/tests/fixtures/versions/wit
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      - run: ci/check-release-freeze.sh examples/evolved/wit
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      # Smoke the checked-out Action against the binary built from this exact commit, exercising
      # the new `binary`, `against`, `freeze`, `diff-check: wire`, and `format: sarif` inputs on
      # `examples/evolved` before a release exists.
      - name: Smoke the local Action against the commit's binary
        id: local-bin-action
        uses: ./
        with:
          binary: ${{ github.workspace }}/target/debug/witforge
          check: examples/evolved/wit/v0.2
          against: examples/evolved/wit/v0.1/wire.lock
          diff-old: examples/evolved/wit/v0.1
          diff-new: examples/evolved/wit/v0.2
          diff-check: wire
          config: examples/evolved/witforge.toml
          generators: rust,proto,schema,glue
          freeze: "true"
          format: sarif
          sarif-file: ${{ runner.temp }}/witforge.sarif
      - name: Verify the emitted SARIF report
        shell: bash
        env:
          SARIF_FILE: ${{ steps.local-bin-action.outputs.sarif-file }}
        run: |
          jq -e '.version == "2.1.0" and (.runs | length) >= 6' "$SARIF_FILE" >/dev/null
      # The release script's version-reference check runs here so drift in README/docs/Action
      # references fails a normal main/PR run, not only a tag release.
      - run: ci/check-release.sh

  buf:
    name: optional historical buf breaking
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buf_breaking }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.CI_RUST_TOOLCHAIN }}
      - run: cargo build --locked -p witforge-cli
      - name: Compute release-tag cache key for baseline binaries
        id: tags
        shell: bash
        run: |
          hash="$(git tag --list 'v*' --sort=v:refname | sha256sum | awk '{print $1}')"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"
      # Reuse previously compiled historical release binaries in manual CI runs only;
      # release.yml deliberately builds every baseline fresh with no cache.
      - name: Cache historical witforge baseline binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/witforge-baselines
          key: witforge-buf-baselines-${{ runner.os }}-${{ steps.tags.outputs.hash }}
          restore-keys: |
            witforge-buf-baselines-${{ runner.os }}-
      - name: Install buf
        shell: bash
        env:
          BUF_VERSION: 1.74.0
          BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
      - name: Compare candidate schemas with historical release generators
        shell: bash
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
          BUF: ${{ runner.temp }}/buf
          BUF_REQUIRED: "1"
          WITFORGE_BASE_CACHE: ${{ runner.temp }}/witforge-baselines
        # Every fixture WIT root against every published release tag.
        run: ci/check-buf-history.sh

  floating-stable:
    name: weekly floating stable check
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scheduled_checks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: rustc --version && cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked

  fuzz-smoke:
    name: weekly fuzz smoke
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scheduled_checks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-09-11
          components: rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run bounded fuzz targets
        shell: bash
        run: |
          cargo +nightly-2026-09-11 fuzz run wit-package fuzz/seeds/wit-package \
            --target x86_64-unknown-linux-gnu -- -dict=fuzz/wit.dict -max_total_time=45
          cargo +nightly-2026-09-11 fuzz run lockfile fuzz/seeds/lockfile \
            --target x86_64-unknown-linux-gnu -- -max_total_time=45
          cargo +nightly-2026-09-11 fuzz run structured-contract fuzz/seeds/structured-contract \
            --target x86_64-unknown-linux-gnu -- -max_total_time=45
      - name: Upload crashing inputs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The one check branch protection requires: every job above passed, or, for the optional/
  # scheduled jobs only (`buf`, `floating-stable`, `fuzz-smoke`), was skipped. Requiring this
  # instead of each job keeps the rule valid when a job is added or renamed (the MSRV job's name
  # carries its version).
  ok:
    name: ci ok
    if: always()
    needs: [lint, workflows, published-action, test, msrv, package, semver, public-api, generated, plan, benchmark, security, buf, floating-stable, fuzz-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | select((.key != "buf" and .key != "floating-stable" and .key != "fuzz-smoke") or .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error title=ci::jobs that did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "every job passed"
