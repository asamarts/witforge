name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buf_breaking:
        description: Run the optional buf breaking check
        type: boolean
        default: false

permissions: {}

# A newer push to a pull request cancels the older run; runs on main always finish, so every
# commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# While the repository is private, jobs use the self-hosted runner of ci/README.md. Once it is
# public, the same workflow selects GitHub-hosted runners: Ubuntu for lint/docs/generation
# and the full Linux/macOS/Windows test matrix. A self-hosted runner must never serve a public
# repository; the release checklist retires it explicitly.

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  workflows:
    name: workflows and scripts
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned rather than the runner image's shellcheck, whose version (and so its findings and
      # codes) changes with the image.
      - name: Install actionlint and shellcheck
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.8
          ACTIONLINT_SHA256: be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" actionlint
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -sSfL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$bin" >> "$GITHUB_PATH"
      # actionlint runs shellcheck on every `run:` script; the masked-return check catches a
      # command substitution whose failure would not fail its step.
      - run: shellcheck --version && actionlint -color
        env:
          SHELLCHECK_OPTS: --enable=check-extra-masked-returns
      - run: shellcheck ci/*.sh ci/runner/*.sh
      - run: bash ci/test-release-asset.sh
      - run: node --test action/test.js
      # Execute the checked-out action through GitHub's JavaScript-action runtime. Unit tests
      # call index.js directly and therefore cannot catch a retired `runs.using` value.
      - name: Smoke the local Action
        uses: ./
        with:
          version: 0.4.1
          check: crates/witforge/tests/fixtures/versions/wit/v0.2
          github-token: ${{ github.token }}

  published-action:
    name: published Action (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A remote pinned ref proves tag resolution and each published platform archive. The local
      # Action smoke above remains the pre-publication proof for changes to action.yml/action/.
      - name: Smoke the published 0.4.3 Action
        uses: asamarts/witforge@v0.4.3
        with:
          version: 0.4.3
          check: crates/witforge/tests/fixtures/versions/wit/v0.2
          generators: ""
          github-token: ${{ github.token }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest","macos-15","windows-latest"]') }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
      # /bin/bash is 3.2 on macOS, which consumers of the freeze script may run it with.
      - if: runner.os != 'Windows'
        run: /bin/bash ci/test-release-freeze.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      # 1.88 is the floor set by wit-parser.
      - run: cargo test --workspace --locked

  package:
    name: package (publish dry run)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Packages and verifies both crates, the CLI against the library through a temporary
      # registry, so a packaging mistake shows up before a release tag.
      - run: cargo publish --workspace --dry-run --locked
      # A second dry run after a library change verifies the CLI against the change, not against
      # the library cargo unpacked and built for the first run.
      - run: ci/test-publish.sh

  semver:
    name: public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo install --locked cargo-semver-checks --version 0.51.0
      # Override the inferred 1.0 major release type: the declared 1.0 policy preserves the
      # reviewed 0.4.1 library surface rather than permitting a last-minute breaking change.
      - run: cargo semver-checks check-release -p witforge --baseline-version 0.4.1 --release-type minor

  benchmark:
    name: benchmark budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo test -p witforge --test bench --release --locked -- --nocapture

  security:
    name: advisories and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.19.9
      - run: ci/check-security.sh

  plan:
    name: aplan plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Pin the published release; no aplan binary is committed to this repository.
      - name: Install aplan 0.6.0
        run: cargo install --locked aplan --version 0.6.0 --root "$RUNNER_TEMP/aplan"
      - name: Run the four plan gates
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/aplan/bin:$PATH"
          aplan check
          aplan verify
          aplan export-agents-md --check AGENTS.md
          aplan check-docs

  generated:
    name: generated output and release freeze
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - run: ci/check-generated.sh
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
      - run: ci/check-release-freeze.sh crates/witforge/tests/fixtures/versions/wit

  buf:
    name: optional historical buf breaking
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.buf_breaking }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","witforge"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: cargo build --locked -p witforge-cli
      - name: Install buf
        shell: bash
        env:
          BUF_VERSION: 1.74.0
          BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
      - name: Compare candidate schemas with historical release generators
        shell: bash
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
          BUF: ${{ runner.temp }}/buf
          BUF_REQUIRED: "1"
          WITFORGE_BASE_CACHE: ${{ runner.temp }}/witforge-baselines
        run: |
          for release in v0.1.2 v0.2.0 v0.3.0 v0.4.1; do
            ci/check-buf.sh crates/witforge/tests/fixtures/versions/wit "$release"
          done
          for fixture in deps deps-full deps-world deps-convert deps-unsupported; do
            ci/check-buf.sh "crates/witforge/tests/fixtures/${fixture}/wit" v0.4.1
          done

  # The one check branch protection requires: every job above passed, or, for the optional buf
  # job only, was skipped. Requiring this instead of each job keeps the rule valid when a job is
  # added or renamed (the MSRV job's name carries its version).
  ok:
    name: ci ok
    if: always()
    needs: [lint, workflows, published-action, test, msrv, package, semver, generated, plan, benchmark, security, buf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | select(.key != "buf" or .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error title=ci::jobs that did not pass: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "every job passed"
