name: Release

# Pushing a tag `vX.Y.Z` on main publishes the crates not yet on crates.io and creates the
# GitHub release from the CHANGELOG.md section. A manual run checks and dry-runs the release
# from the selected branch or tag and publishes nothing: `publish` and `github-release` run only
# for a tag push (a re-run of a run keeps its event, so re-running a tag push still publishes).
#
# Publishing uses crates.io trusted publishing: the `publish` job exchanges its GitHub OIDC
# token for a crates.io token that lasts minutes, so no crates.io secret is stored. Each crate
# trusts this repository, this workflow file, and the `release` environment (crates.io: the
# crate's Settings, Trusted Publishing). crates.io cannot trust a repository for a crate that
# does not exist yet, so a new crate's first version is published by hand with an API token
# (ci/release-checklist.md); this workflow then skips it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: check and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read # prove the tag commit's aggregate CI result before publication
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check the version, changelog, and tag
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        # A separate assignment, so a failed check fails the step (`echo "...$(...)"` would not).
        run: |
          version="$(ci/check-release.sh "${TAG}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Require ci ok for the tag commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${GITHUB_SHA}" -f event=push -f status=completed -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | first | .id // empty'
          )"
          if [[ -z "${run_id}" ]]; then
            echo "::error title=release::no successful CI run exists for ${GITHUB_SHA}"
            exit 1
          fi
          ci_ok_url="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              -f per_page=100 \
              --jq '[.jobs[] | select(.name == "ci ok" and .conclusion == "success")] | first | .html_url // empty'
          )"
          if [[ -z "${ci_ok_url}" ]]; then
            echo "::error title=release::run ${run_id} has no successful ci ok job"
            exit 1
          fi
          echo "exact-commit ci ok: ${ci_ok_url}"
      - run: cargo test --workspace --locked
      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks --version 0.51.0
      - name: Deny library API breaks since 0.4.1
        run: cargo semver-checks check-release -p witforge --baseline-version 0.4.1 --release-type minor
      - name: Install buf
        shell: bash
        env:
          BUF_VERSION: 1.74.0
          BUF_SHA256: 92326d957d613712669fb55f9e4340946a8142a92120e09008459118778273d2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $RUNNER_TEMP/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf"
      - run: cargo build --locked -p witforge-cli
      - name: Compare protobuf with historical release generators
        shell: bash
        env:
          WITFORGE: ${{ github.workspace }}/target/debug/witforge
          BUF: ${{ runner.temp }}/buf
          BUF_REQUIRED: "1"
          WITFORGE_BASE_CACHE: ${{ runner.temp }}/witforge-baselines
        run: |
          for release in v0.1.2 v0.2.0 v0.3.0 v0.4.1; do
            ci/check-buf.sh crates/witforge/tests/fixtures/versions/wit "$release"
          done
          for fixture in deps deps-full deps-world deps-convert deps-unsupported; do
            ci/check-buf.sh "crates/witforge/tests/fixtures/${fixture}/wit" v0.4.1
          done
      - run: ci/publish.sh --dry-run

  publish:
    name: publish to crates.io
    needs: verify
    # Not `ref_type` alone: a manual run from a tag has a tag ref too.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges for a publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Find the crates not yet on crates.io
        id: missing
        shell: bash
        # A crates.io error must fail the job, not read as "nothing to publish".
        run: |
          missing="$(ci/publish.sh --check)"
          echo "crates=${missing//$'\n'/ }" >> "$GITHUB_OUTPUT"
      # Only when something is left to publish, so a re-run, or a release whose crates were
      # published by hand, needs no trusted-publisher configuration.
      - name: Mint a short-lived crates.io token
        id: auth
        if: steps.missing.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish ${{ steps.missing.outputs.crates }}
        if: steps.missing.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: ci/publish.sh

  github-release:
    name: GitHub release
    needs: [verify, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the release from the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          RELEASE_NOTES="${RUNNER_TEMP}/notes.md" ci/check-release.sh "${TAG}" >/dev/null
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "witforge ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"

  binaries:
    name: binary (${{ matrix.target }})
    needs: [verify, github-release]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build the release binary
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release -p witforge-cli --target "${{ matrix.target }}"
      - name: Package and checksum the asset
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/${TARGET}/release/witforge"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          asset="$(ci/release-asset.sh "${VERSION}" "${TARGET}" "${binary}" dist)"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "checksum=${asset}.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload the asset to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber

  action-smoke:
    name: published Action smoke
    needs: [verify, binaries]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the tagged release and check a version
        uses: ./
        with:
          version: ${{ needs.verify.outputs.version }}
          check: examples/evolved/wit/v0.2
          generators: ""
          github-token: ${{ github.token }}
      - name: Materialize expected configured output
        shell: bash
        run: |
          witforge rust --config examples/evolved/witforge.toml
          witforge proto --config examples/evolved/witforge.toml
          witforge schema --config examples/evolved/witforge.toml
          witforge glue --config examples/evolved/witforge.toml
      - name: Check configured output through the tagged Action
        uses: ./
        with:
          version: ${{ needs.verify.outputs.version }}
          check: examples/evolved/wit/v0.2
          config: examples/evolved/witforge.toml
          project: tasks
          generators: rust,proto,schema,glue
          github-token: ${{ github.token }}
