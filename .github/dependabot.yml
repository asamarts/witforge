version: 2

# Weekly version updates, grouping patch and minor bumps into at most one pull request per
# ecosystem while isolating breaking major updates. CI (`ci.yml` + `docs.yml`) verifies each PR.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-patch-and-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fuzz-patch-and-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      site-npm-patch-and-minor:
        update-types: [patch, minor]
    ignore:
      # docs.yml runs Node 24 LTS; keep @types/node aligned with Node 24 until the runner upgrades.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check requires peer typescript@"^5.0.0 || ^6.0.0"; hold TypeScript 7 until Astro supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    commit-message:
      prefix: deps
