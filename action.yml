name: witforge
description: Install a prebuilt witforge release, then check, diff, freeze-check, and generate a WIT contract.
author: asamarts
branding:
  icon: check-circle
  color: blue
inputs:
  version:
    description: >-
      Release version to install (`X.Y.Z`, `vX.Y.Z`, or `latest`). Leave empty to install the
      version named by the Action ref when it is a release tag, or the workspace version recorded
      in the Action's own tree at a commit SHA, branch, or local `./` ref. Never falls back to
      `latest` unless `version: latest` is passed explicitly. Cannot be combined with `binary`.
    required: false
    default: ''
  binary:
    description: >-
      Optional path to an existing `witforge` executable to use instead of downloading a GitHub
      release (for testing the checked-out Action against a local build or running air-gapped).
      Cannot be combined with `version`.
    required: false
    default: ''
  check:
    description: >-
      WIT version directories or WIT roots to pass to `witforge check`, one per line, or `true` to
      check every project in `config`.
    required: false
    default: ''
  against:
    description: >-
      Baseline `wire.lock` path(s) for `witforge check --against`. When `check` names a single
      directory, pass a single lockfile path (for example `wit/v0.1/wire.lock`). When `check`
      names multiple directories, pass one `<check-dir>=<baseline-lockfile>` line per entry.
    required: false
    default: ''
  diff-old:
    description: Old version directory or WIT root for `witforge diff`.
    required: false
    default: ''
  diff-new:
    description: New version directory or WIT root for `witforge diff`.
    required: false
    default: ''
  diff-check:
    description: >-
      Gate `witforge diff` on breaking changes: `true` for the default views (`--check`), `false`
      to report without failing, or a comma-separated list of views such as `wire`, `wire,decode`,
      or `wire,api` (`--check=<views>`).
    required: false
    default: 'true'
  config:
    description: Optional `witforge.toml` for generate/check/freeze runs.
    required: false
    default: ''
  project:
    description: Optional project name in `witforge.toml`.
    required: false
    default: ''
  generators:
    description: >-
      Comma- or whitespace-separated generators to run with `--check` against `config`
      (`rust`, `proto`, `schema`, `glue`), or `all` to run `witforge generate --check` across every
      configured generator and project. Empty skips generation.
    required: false
    default: 'rust'
  freeze:
    description: >-
      WIT roots to verify with `witforge freeze`, one per line, or `true` to verify every project
      in `config`. Requires full Git history (`fetch-depth: 0` on `actions/checkout`).
    required: false
    default: ''
  format:
    description: >-
      Diagnostic output format (`human`, `json`, or `sarif`). Failing checks always emit GitHub
      workflow annotations when file/line positions are available.
    required: false
    default: 'human'
  sarif-file:
    description: >-
      Path to write the combined SARIF 2.1.0 report when `format: sarif` is set (default
      `witforge.sarif`).
    required: false
    default: ''
  github-token:
    description: >-
      Token used for GitHub API queries (`version: latest` lookup and `gh attestation verify`);
      defaults to the workflow token. Release assets are downloaded without it.
    required: false
    default: ${{ github.token }}
outputs:
  failed-command:
    description: >-
      Empty on success; names the failing stage (`install` or `witforge <subcommand>`, such as
      `witforge diff`) when the step fails.
  sarif-file:
    description: >-
      Path to the written SARIF 2.1.0 report when `format: sarif` was requested.
runs:
  using: node24
  main: action/index.js
