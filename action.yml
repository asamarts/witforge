name: witforge
description: Install a prebuilt witforge release, then check, diff, and generate a WIT contract.
author: asamarts
branding:
  icon: check-circle
  color: blue
inputs:
  version:
    description: >-
      Release version to install, with or without a leading `v`. Leave empty to use the action
      ref when it is a version tag (for example `v0.3.0`), otherwise the latest release.
    required: false
    default: ''
  check:
    description: >-
      WIT version directories to pass to `witforge check`, one per line.
    required: false
    default: ''
  diff-old:
    description: Old version directory or WIT root for `witforge diff`.
    required: false
    default: ''
  diff-new:
    description: New version directory or WIT root for `witforge diff`.
    required: false
    default: ''
  diff-check:
    description: >-
      Gate `witforge diff` on breaking changes: `true` for the default views (`--check`), `false`
      to report without failing, or a comma-separated list of views such as `wire`, `wire,decode`,
      or `wire,api` (`--check=<views>`).
    required: false
    default: 'true'
  config:
    description: Optional `witforge.toml` for generate/check runs.
    required: false
    default: ''
  project:
    description: Optional project name in `witforge.toml`.
    required: false
    default: ''
  generators:
    description: >-
      Comma- or whitespace-separated generators to run with `--check` against `config`
      (`rust`, `proto`, `schema`, `glue`). Empty skips generation.
    required: false
    default: 'rust'
  freeze:
    description: >-
      WIT roots to verify with `witforge freeze`, one per line, or `true` to verify every project
      in `config`. Requires full Git history (`fetch-depth: 0` on `actions/checkout`).
    required: false
    default: ''
  github-token:
    description: Token used only to query the latest release; pass the workflow token for rate limits. Release assets are downloaded without it.
    required: false
    default: ''
runs:
  using: node24
  main: action/index.js
