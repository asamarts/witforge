[package]
name = "witforge-build"
description = "Build-script helper for compiling witforge-generated protobuf schemas with protox, prost-build, and optional pbjson-build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/witforge-build"
keywords = ["wit", "protobuf", "prost", "build-dependencies", "witforge"]
categories = ["development-tools::build-utils", "encoding"]
exclude = ["tests/"]
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
pbjson = ["dep:pbjson-build"]

[dependencies]
prost-build = "0.14"
protox = "0.10"
pbjson-build = { version = "0.9", optional = true }

[dev-dependencies]
pbjson = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
witforge = { path = "../witforge" }

[lints]
workspace = true
