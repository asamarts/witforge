[package]
name = "witforge-cli"
description = "Command-line interface for witforge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://asamarts.github.io/witforge/guide/"
readme = "../../README.md"
keywords = ["wit", "wasm", "protobuf", "codegen", "cli"]
categories = ["development-tools", "command-line-utilities", "wasm"]
# The tests read the library crate's fixtures, which are not in this package.
exclude = ["tests/"]
publish = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/witforge-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/witforge-{ version }-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/witforge-{ version }-aarch64-unknown-linux-musl.tar.gz"

[[bin]]
name = "witforge"
path = "src/main.rs"
# The library crate is also named `witforge`; documenting both would write to one path.
doc = false

[dependencies]
witforge = { path = "../witforge", version = "0.8.0" }
anyhow.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[lints]
workspace = true

[dev-dependencies]
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
