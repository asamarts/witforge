[package]
name = "witforge-cli"
description = "Command-line interface for witforge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "witforge"
path = "src/main.rs"
# The library crate is also named `witforge`; documenting both would write to one path.
doc = false

[dependencies]
witforge = { path = "../witforge" }
anyhow.workspace = true
clap.workspace = true

[lints]
workspace = true

[dev-dependencies]
pbjson = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
