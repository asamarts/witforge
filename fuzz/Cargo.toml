[package]
name = "witforge-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
witforge = { path = "../crates/witforge", version = "0" }

[[bin]]
name = "wit-package"
path = "fuzz_targets/wit_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lockfile"
path = "fuzz_targets/lockfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured-contract"
path = "fuzz_targets/structured_contract.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "3"
