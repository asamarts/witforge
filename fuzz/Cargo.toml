[package]
name = "witforge-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
witforge = { path = "../crates/witforge" }

[[bin]]
name = "wit_package"
path = "fuzz_targets/wit_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lockfile"
path = "fuzz_targets/lockfile.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "3"
